# Собирает APK для Android при каждом изменении приложения.
# Сборка из основной ветки публикуется в релиз «apk» — оттуда её скачивают на телефон:
# https://github.com/<владелец>/<репозиторий>/releases/tag/apk
name: Сборка APK

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты и проверка типов
        run: npm test && npm run typecheck

      - name: Генерация Android-проекта
        run: npx expo prebuild --platform android --no-install

      - name: Сборка APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Переименование
        run: mv android/app/build/outputs/apk/release/app-release.apk ne-zabud-pozdravit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ne-zabud-pozdravit-apk
          path: app/ne-zabud-pozdravit.apk

      - name: Публикация в релиз «apk»
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ne-zabud-pozdravit.apk \
            --target "${{ github.sha }}" \
            --title "Не забудь поздравить — сборка ${{ github.run_number }}" \
            --notes "Скачайте ne-zabud-pozdravit.apk на телефон Android и откройте его, чтобы установить. Новая версия ставится поверх старой, данные сохраняются."
